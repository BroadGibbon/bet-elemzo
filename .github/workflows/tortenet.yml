name: BET arfolyam-tortenet

# Ez a nehez letoltes: minden reszveny teljes tortenete.
# Szandekosan NEM fut naponta - eleg havonta, vagy amikor kezzel elinditod.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"   # minden honap 1-jen

permissions:
  contents: write

concurrency:
  group: bet-adat-iras
  cancel-in-progress: false

jobs:
  tortenet:
    runs-on: ubuntu-latest

    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Friss reszvenylista
        run: |
          mkdir -p data
          python fetch_bet.py

      - name: Teljes arfolyam-tortenet letoltese
        run: python fetch_arfolyam.py

      - name: Eredmeny visszamentese a repoba
        run: |
          git config user.name "BET robot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nincs valtozas, nincs mit menteni."
            exit 0
          fi
          git commit -m "Arfolyam-tortenet: $(date -u '+%Y-%m-%d') UTC"
          for probalkozas in 1 2 3 4 5; do
            if git push; then
              echo "Sikeres push."
              exit 0
            fi
            echo "Push sikertelen ($probalkozas. probalkozas), ujraprobalom pull --rebase utan..."
            git pull --rebase origin main
            sleep $((probalkozas * 5))
          done
          echo "Vegleg sikertelen a push 5 probalkozas utan."
          exit 1
