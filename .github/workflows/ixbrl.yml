name: BET iXBRL eves jelentesek

# Ez a legidoigenyesebb letoltes - cegenkent akar 6 kulon fajlt is
# letolt es dolgoz fel az MNB kozzeteteli rendszerebol. Az eves jelentesek
# ritkan valtoznak, ezert eleg havonta futtatni, vagy kezzel amikor kell.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"   # minden honap 1-jen, a tobbi utan

permissions:
  contents: write

# FONTOS: ha tobb BET-workflow egyszerre probalna a repoba irni (pl. a
# weboldal "Minden egyszerre" gombjaval inditva), git push utkozes lenne
# a kovetkezmenye. Ez a "concurrency" beallitas - MINDEN BET workflow-ban
# ugyanezzel a nevvel - sorba allitja oket, nem hagyja parhuzamosan futni.
concurrency:
  group: bet-adat-iras
  cancel-in-progress: false

jobs:
  ixbrl:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # biztonsagi fek, ha valami elakadna

    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: iXBRL eves jelentesek letoltese es feldolgozasa
        run: python fetch_ixbrl.py

      # Ha korabban hozzaadtad az audit lepest, ird vissza ide - ez a
      # lepes csak a mar letoltott fajlokat elemzi, nem tolt le semmit,
      # ezert barhova beteheted a letoltes es a push koze:
      - name: Frissesegi ellenorzes
        run: python audit_ixbrl.py

      - name: Eredmeny visszamentese a repoba
        run: |
          git config user.name "BET robot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nincs valtozas, nincs mit menteni."
            exit 0
          fi
          git commit -m "iXBRL eves jelentesek: $(date -u '+%Y-%m-%d') UTC"
          for probalkozas in 1 2 3 4 5; do
            if git push; then
              echo "Sikeres push."
              exit 0
            fi
            echo "Push sikertelen ($probalkozas. probalkozas), ujraprobalom pull --rebase utan..."
            git pull --rebase origin main
            sleep $((probalkozas * 5))
          done
          echo "Vegleg sikertelen a push 5 probalkozas utan."
          exit 1
