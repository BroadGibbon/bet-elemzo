name: BET adatfrissites

on:
  # Kezi inditas: a GitHub "Actions" fulen lesz egy "Run workflow" gomb
  workflow_dispatch:

  # Automatikus inditas: hetkoznaponkent 18:10-kor (magyar ido)
  schedule:
    - cron: "10 16 * * 1-5"

# Engedely, hogy a robot vissza tudja irni a letoltott adatot a repoba
permissions:
  contents: write

# FONTOS: ha tobb BET-workflow egyszerre probalna a repoba irni (pl. a
# weboldal "Minden egyszerre" gombjaval inditva), git push utkozes lenne
# a kovetkezmenye. Ez a "concurrency" beallitas - MINDEN BET workflow-ban
# ugyanezzel a nevvel - sorba allitja oket, nem hagyja parhuzamosan futni.
concurrency:
  group: bet-adat-iras
  cancel-in-progress: false

jobs:
  letoltes:
    runs-on: ubuntu-latest

    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adatok letoltese a BET-rol
        run: |
          mkdir -p data
          python fetch_bet.py

      - name: Eredmeny visszamentese a repoba
        run: |
          git config user.name "BET robot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nincs valtozas, nincs mit menteni."
            exit 0
          fi
          git commit -m "Adatfrissites: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for probalkozas in 1 2 3 4 5; do
            if git push; then
              echo "Sikeres push."
              exit 0
            fi
            echo "Push sikertelen ($probalkozas. probalkozas), ujraprobalom pull --rebase utan..."
            git pull --rebase origin main
            sleep $((probalkozas * 5))
          done
          echo "Vegleg sikertelen a push 5 probalkozas utan."
          exit 1
